# Builds the paper list from every PDF in pdfs/ and deploys the site to GitHub Pages.
# Add a new paper by putting its PDF in pdfs/ and pushing (or uploading it on github.com).
name: Build papers & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyMuPDF
        run: pip install pymupdf

      # Re-use page images from earlier runs; only new/changed PDFs get rendered.
      - name: Cache rendered pages
        uses: actions/cache@v4
        with:
          path: assets/pages
          key: pages-${{ hashFiles('pdfs/**', 'scripts/build_papers.py') }}
          restore-keys: pages-

      - name: Build paper list from PDFs
        run: python scripts/build_papers.py

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js assets _site/
          find _site/assets -name .source -delete

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
